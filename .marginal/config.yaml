version: 1
review:
  enabled: true
  inline_comments: true
  max_comments: 8
  max_prompt_tokens: 100000
  tone: concise
context:
  git_history: true
  code_graph: true
  cross_repository: false
ownership:
  codeowners: true
  notify_responsible: false
proposals:
  enabled: true
models:
  reviewer:
    provider: anthropic
    model: claude-sonnet-5
policies:
  - .marginal/policies/money.md
  - .marginal/policies/testing.md
anti_policies: []
permissions:
  read:
    repository: true
    issues: true
    pull_requests: true
  write:
    comments: true
    labels: false
    approve: false
    push: true   # only for the rolling knowledge PR (scenario 11)
    merge: false
dependencies:
  check: true
