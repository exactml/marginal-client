[project]
name = "shop"
version = "0.2.0"
description = "Tiny order-pricing service used as marginal's end-to-end test customer"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "requests==2.34.2", "reqeusts>=2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
