name: marginal

# Installs marginal from git instead of PyPI (marginal-action), so unreleased
# changes are tested here before a release is cut. The released path is
# already exercised by marginal's own repo, which runs marginal-action@v1.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # prove-it: review a PR here with an unmerged marginal branch.
  workflow_dispatch:
    inputs:
      ref:
        description: marginal branch, tag, or SHA to install
        default: master
      pr:
        description: Pull request number to review
        required: true

concurrency:
  group: marginal-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      # Resolving a review thread needs contents: write; marginal never pushes.
      contents: write
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      REF: ${{ inputs.ref || 'master' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR }}/head

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install marginal from git
        run: pip install "marginal-review[anthropic] @ git+https://github.com/exactml/marginal@${REF}"

      - name: Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "marginal @ ${REF}: $(marginal --version)"
          marginal review --repo "${{ github.repository }}" --pr "$PR" --comment
